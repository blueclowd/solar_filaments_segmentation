seed: 42                    # with val_fraction/split_by below, gives the same split as unet_r34.yaml
output_dir: runs/instance_r34

data:
  root: /kaggle/input/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026
  crop_size: 256            # each filament window is resized to this
  margin: 0.25              # window = box enlarged by this fraction on each side
  min_window: 48            # smallest window side in original pixels
  max_aspect: 2.0           # long thin boxes get a wider window for context
  box_jitter: 0.1           # training-time box noise (fraction of box side) to mimic YOLO error
  val_fraction: 0.15
  split_by: month
  cache_images: true        # full-resolution 2048 images in RAM (~3 GB)
  num_workers: 4

model:
  arch: Unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 2            # image crop + box mask
  kwargs:
    decoder_attention_type: scse

train:
  epochs: 20
  batch_size: 32
  lr: 3.0e-4
  min_lr_ratio: 0.01
  weight_decay: 1.0e-4
  warmup_epochs: 1
  grad_clip: 1.0
  amp: true
  channels_last: true
  multi_gpu: false
  val_every: 1
  val_batch_size: 64
  loss:
    bce_weight: 1.0
    dice_weight: 1.0
    pos_weight: null

postprocess:                # used by predict_instances.py; tuned there on validation
  threshold: 0.5            # per-filament mask probability
  conf: 0.25                # YOLO box confidence
  min_area: 200
  nms_iou: 0.5              # mask IoU above which a lower-confidence box is a duplicate
